<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ディクテオンの洞窟</title>
<meta name="theme-color" content="#0b0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ディクテオン">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face { font-family: 'DotGothic16'; src: url(fonts/DotGothic16-subset.woff2) format('woff2'); font-display: swap; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
</style>
</head>
<body>

<style>
/* Layout: phone-first one-screen app — HUD / pixel stage / thumb controls; full-screen sheets for menus and the temple */
:root {
  --bg: #0b0a14;
  --panel: #151330;
  --row: #1c1a3a;
  --row-hi: #2a2660;
  --ink: #f6f3ff;
  --muted: #a6a3c8;
  --win-top: #2a3290;
  --win-bot: #10144a;
  --edge: #f2f0ff;
  --gold: #ffd94a;
  --hp: #6ff08a;
  --hp-low: #ff6060;
  --food: #f0a850;
  --cursor: #ffe27a;
  --pad: #1d1a36;
  --pad-edge: #3d3870;
  --pad-ink: #ddd8ff;
  --atk: #5a2348;
  --atk-edge: #93406f;
  --r0: #f2f0ff;
  --r1: #79b0ff;
  --r2: #ffd84a;
  --r3: #cf97ff;
  --r4: #ff8a3d;
  --font: 'DotGothic16', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; background: var(--bg); }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--bg); color: var(--ink); font-family: var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--cursor); outline-offset: 2px; }

#app {
  height: 100%; max-width: 560px; margin: 0 auto;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px;
  grid-template-areas: "hud" "stage" "ctrl";
}
#hud { grid-area: hud; display: grid; gap: 3px; font-size: 14px; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
#hud .l { display: flex; align-items: center; gap: 10px; white-space: nowrap; min-width: 0; }
#hud .fl { color: var(--gold); font-size: 17px; }
#hud b { font-weight: normal; color: var(--gold); }
.bar { flex: 1; height: 8px; background: #2a1426; border: 1px solid #000; outline: 1px solid #4b4675; min-width: 40px; }
.bar i { display: block; height: 100%; background: var(--hp); }
.bar.food { background: #2a2014; }
.bar.food i { background: var(--food); }
#hud .low { color: var(--hp-low); }
#hud .chip { font-size: 11px; padding: 0 5px; border-radius: 3px; background: #3a2a6a; color: #fff; }

#stage { grid-area: stage; position: relative; background: #000; overflow: hidden; outline: 2px solid #2b2745; outline-offset: 1px; touch-action: none; }
#cv { position: absolute; left: 0; top: 0; image-rendering: pixelated; }
.win {
  background: linear-gradient(180deg, var(--win-top), var(--win-bot));
  border: 3px solid var(--edge); border-radius: 7px;
  box-shadow: 0 0 0 2px #000, inset 0 0 0 2px #000; color: var(--ink);
}
#msg {
  position: absolute; left: 8px; right: 8px; bottom: 8px; padding: 6px 12px;
  font-size: 14px; line-height: 1.55; min-height: calc(3 * 1.55em + 12px); transition: opacity .35s; pointer-events: none;
}
#msg.fade { opacity: 0; }
#msg p { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#msg p.old { color: var(--muted); }
#floorfx { position: absolute; inset: 0; background: #000; display: flex; align-items: center; justify-content: center;
  font-size: 34px; letter-spacing: .12em; opacity: 0; pointer-events: none; transition: opacity .25s; }
#floorfx.on { opacity: 1; }

#ctrl { grid-area: ctrl; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; gap: 10px; padding-bottom: 2px; }
#pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: min(48vw, 216px); touch-action: none; }
#pad button {
  aspect-ratio: 1; padding: 0; font-size: 22px; color: var(--pad-ink); background: var(--pad);
  border: 1px solid var(--pad-edge); border-bottom-width: 3px; border-radius: 10px; touch-action: none;
}
#pad button.c { font-size: 12px; }
#pad button:active, #pad button.on { background: var(--row-hi); color: #fff; }
/* thumb columns either side of the centred pad */
.side { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.side button {
  flex: 1; min-height: 40px; padding: 4px 2px; font-size: 14px; color: var(--pad-ink); background: var(--pad);
  border: 1px solid var(--pad-edge); border-bottom-width: 3px; border-radius: 10px;
}
.side .a { flex: 2; font-size: 18px; background: var(--atk); border-color: var(--atk-edge); color: #fff; }
.side button.on { background: #4a3a10; border-color: #b08a30; color: var(--gold); }
.side button:active { filter: brightness(1.35); }

@media (orientation: landscape) and (max-height: 560px) {
  #app { max-width: none; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "hud hud" "stage ctrl"; column-gap: 12px; }
  #ctrl { grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; align-content: end; }
  #pad { grid-column: span 2; order: -1; width: min(24vw, 40vh); justify-self: center; }
  .side button { min-height: 30px; font-size: 13px; }
  .side .a { font-size: 15px; }
}

/* full-screen sheets */
#sheet {
  position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; justify-content: center;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
}
.panel { width: 100%; max-width: 560px; height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 12px; min-height: 0; }
.sh-head { display: flex; align-items: center; gap: 10px; }
.sh-head h2 { margin: 0; font-size: 20px; font-weight: normal; color: var(--gold); flex: 1; min-width: 0; text-wrap: balance; }
.sh-head .sub { color: var(--muted); font-size: 13px; }
.x { flex: none; min-width: 104px; min-height: 48px; background: var(--row); border: 1px solid var(--pad-edge); border-bottom-width: 3px; border-radius: 10px; font-size: 16px; padding: 0 18px; }
.sh-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: 8px; }
.tabs { display: flex; gap: 6px; }
.tabs button { flex: 1; padding: 10px 4px; background: var(--row); border: 1px solid var(--pad-edge); border-radius: 8px; color: var(--muted); }
.tabs button.on { background: var(--row-hi); color: var(--ink); border-color: var(--cursor); }
.row { display: flex; gap: 6px; align-items: stretch; }
.item {
  flex: 1; min-width: 0; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 10px;
  text-align: left; padding: 7px 10px; min-height: 54px; background: var(--row); border: 1px solid #2c2856; border-radius: 9px;
}
.item:active, .item.sel { background: var(--row-hi); }
.item img, .ico { width: 32px; height: 32px; image-rendering: pixelated; }
.item .t { display: flex; flex-direction: column; min-width: 0; gap: 2px; }
.item .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
.item .af { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .bd { font-size: 12px; color: var(--gold); text-align: right; white-space: nowrap; }
.quick { min-width: 64px; background: #23304a; border: 1px solid #3a5a8a; border-radius: 9px; font-size: 13px; padding: 0 6px; }
.r0 { color: var(--r0); } .r1 { color: var(--r1); } .r2 { color: var(--r2); } .r3 { color: var(--r3); } .r4 { color: var(--r4); }
.empty { color: var(--muted); padding: 18px 6px; text-align: center; }
.eqstrip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.eqstrip button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; background: var(--panel); border: 1px dashed #3b3670; border-radius: 9px; min-width: 0; }
.eqstrip span { font-size: 11px; color: var(--muted); }
.eqstrip em { font-style: normal; font-size: 12px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu-list { display: flex; flex-direction: column; gap: 8px; }
.big {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px 16px; font-size: 17px;
  background: var(--row); border: 1px solid #34306a; border-bottom-width: 3px; border-radius: 11px;
}
.big { flex-direction: column; align-items: flex-start; gap: 2px; }
.big small { display: block; color: var(--muted); font-size: 12px; }
.big.primary { background: #3a2a6e; border-color: #7a64d0; }
.big:disabled { opacity: .4; }
.note { font-size: 13px; color: var(--muted); line-height: 1.6; }
.note b { color: var(--gold); font-weight: normal; }
.bagnote { padding: 10px 12px; border: 1px solid #6a3a8a; background: #24133a; border-radius: 10px; font-size: 13px; line-height: 1.6; }
.money { color: var(--gold); font-variant-numeric: tabular-nums; }
.art { width: 100%; image-rendering: pixelated; border-radius: 10px; border: 1px solid #2c2856; background: #000; display: block; }

#detail {
  position: fixed; z-index: 30; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); max-width: 528px; margin: 0 auto; max-height: 78%;
  overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
}
#detail .hd { display: flex; gap: 12px; align-items: center; }
#detail .hd img { width: 48px; height: 48px; image-rendering: pixelated; }
#detail .nm { font-size: 18px; }
#detail .rk { font-size: 12px; color: var(--muted); }
#detail ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 14px; }
#detail li::before { content: "◆ "; color: var(--r1); }
#detail .base { font-size: 15px; }
#detail .cmp { font-size: 13px; color: var(--muted); }
#detail .up { color: #7cf09a; } #detail .down { color: #ff7a7a; }
#detail .ds { font-size: 13px; color: #d8d4f4; line-height: 1.6; }
#detail .flavor { font-size: 12.5px; color: #e8c890; }
.acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin-top: 4px; }
.acts button { padding: 12px 4px; font-size: 15px; background: #26306e; border: 1px solid #8090e0; border-bottom-width: 3px; border-radius: 9px; }
.acts button.sub { background: #1c1a36; border-color: #4a4680; }
.acts button:disabled { opacity: .4; }

#dlg { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .5);
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
#dlg .win { width: min(100%, 420px); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
#dlg p { margin: 0; line-height: 1.6; font-size: 16px; }
#toast { position: fixed; z-index: 50; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 50%; translate: -50% 0; padding: 8px 16px; font-size: 14px; max-width: 90%; text-align: center; pointer-events: none; }

.title { align-items: center; justify-content: center; text-align: center; gap: 14px; }
.title h1 { margin: 0; font-weight: normal; font-size: min(56px, calc((100vw - 48px) / 10)); letter-spacing: .04em; white-space: nowrap; color: var(--gold);
  text-shadow: 3px 3px 0 #6a2a10, 0 0 18px rgba(255, 190, 60, .35); }
.title .sub { font-size: 15px; }
.title .menu-list { width: min(100%, 360px); }
.stats { display: grid; grid-template-columns: auto auto; gap: 4px 18px; justify-content: center; font-size: 15px; font-variant-numeric: tabular-nums; }
.stats dt { color: var(--muted); text-align: right; } .stats dd { margin: 0; text-align: left; }
.book { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.book div { background: var(--row); border: 1px solid #2c2856; border-radius: 9px; padding: 10px; display: grid; gap: 4px; justify-items: center; text-align: center; font-size: 13px; }
.book .no img { filter: brightness(0) opacity(.5); }
.book small { color: var(--muted); font-size: 11px; line-height: 1.4; }
.keys { font-size: 13px; line-height: 2; color: var(--muted); }
.keys kbd { font-family: var(--font); color: var(--ink); background: var(--pad); border: 1px solid var(--pad-edge); border-radius: 3px; padding: 0 .4em; }
@media (prefers-reduced-motion: reduce) { #floorfx, #msg { transition: none; } }
</style>

<div id="app">
  <header id="hud"></header>
  <div id="stage">
    <canvas id="cv" aria-label="ダンジョンの画面"></canvas>
    <div id="msg" class="win fade"></div>
    <div id="floorfx"></div>
  </div>
  <div id="ctrl">
    <div class="side" id="lside">
      <button type="button" id="bI">道具</button>
      <button type="button" id="bF">足元</button>
      <button type="button" id="bM">メニュー</button>
    </div>
    <div id="pad">
      <button type="button" data-d="-1,-1" aria-label="左上">↖</button><button type="button" data-d="0,-1" aria-label="上">↑</button><button type="button" data-d="1,-1" aria-label="右上">↗</button>
      <button type="button" data-d="-1,0" aria-label="左">←</button><button type="button" class="c" data-wait="1">足踏み</button><button type="button" data-d="1,0" aria-label="右">→</button>
      <button type="button" data-d="-1,1" aria-label="左下">↙</button><button type="button" data-d="0,1" aria-label="下">↓</button><button type="button" data-d="1,1" aria-label="右下">↘</button>
    </div>
    <div class="side" id="rside">
      <button type="button" class="a" id="bA">攻撃</button>
      <button type="button" id="bD">ダッシュ</button>
      <button type="button" id="bT">向き</button>
    </div>
  </div>
</div>
<div id="sheet" hidden></div>
<div id="detail" class="win" hidden></div>
<div id="dlg" hidden></div>
<div id="toast" class="win" hidden></div>

// second animation frame: hand-drawn where it matters, otherwise a 1px squash that keeps the feet planted
const FRAME2 = {
  bat: ['................','................','................','................','......k..k......','......kkkk......',
    '.....kppppk.....','..kkkpwppwpkkk..','.kPPPpkppkpPPPk.','kPPPPppppppPPPPk','kPPkkpprrppkkPPk','kPk..kppppk..kPk',
    'kk.....kk.....kk','k..............k','................','................'],
};
const FEET2 = { athena_f: '...kok....kok...', athena_b: '...kok....kok...', athena_s: '...kok...kok....' };
function frameRows(name, frame) {
  const rows = SPR[name];
  if (frame === 2) return rows.map((r, y) => (y === 11 || y === 12) ? r.replace(/[uw]/g, 's') : r);
  if (!frame) return rows;
  if (FRAME2[name]) return FRAME2[name];
  let last = rows.length - 1;
  while (last > 2 && !/[^.]/.test(rows[last])) last--;
  const out = ['................', ...rows.slice(0, last - 2), ...rows.slice(last - 1)];
  while (out.length < rows.length) out.push('................');
  if (FEET2[name]) out[rows.length - 1] = FEET2[name];
  return out;
}
function spr(name, pal, white, frame = 0) {
  const key = name + '|' + (pal ? JSON.stringify(pal) : '') + (white ? '|w' : '') + '|' + frame;
  let c = sprCache.get(key);
  if (c) return c;
  const rows = frameRows(name, frame);
  c = document.createElement('canvas'); c.width = 16; c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((row, y) => {
    for (let x = 0; x < 16; x++) {
      const ch = row[x];
      if (!ch || ch === '.') continue;
      const col = white ? '#ffffff' : ((pal && pal[ch]) || PAL[ch]);
      if (!col) continue;
      g.fillStyle = col; g.fillRect(x, y, 1, 1);
    }
  });
  sprCache.set(key, c);
  return c;
}
const iconCache = new Map();
function iconFor(it) {
  const d = IT[it.k], key = it.k;
  if (!iconCache.has(key)) iconCache.set(key, spr(d.s, d.pal).toDataURL());
  return iconCache.get(key);
}
const GLYPH = {
  '0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001',
  '5':'111100111001111','6':'111100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001111',
  '+':'000010111010000','Z':'111001010100111','-':'000000111000000','!':'010010010000010',
};
function pixText(g, str, x, y, col) {
  let cx = Math.round(x - (str.length * 4 - 1) / 2);
  for (const ch of str) {
    const gl = GLYPH[ch];
    if (gl) for (let i = 0; i < 15; i++) if (gl[i] === '1') {
      const px = cx + (i % 3), py = y + Math.floor(i / 3);
      g.fillStyle = '#000'; g.fillRect(px + 1, py + 1, 1, 1);
      g.fillStyle = col; g.fillRect(px, py, 1, 1);
    }
    cx += 4;
  }
}

function freshMetaShape() { return { v: 2, seq: 1, bank: 0, storage: [], inv: [], eq: { w: 0, s: 0, b: 0 }, bags: [], found: {}, deepest: 0, clears: 0, runs: 0, sound: false, map: true, rares: 0, legends: 0, uniques: 0 }; }

function packRun(g) {
  if (!g) return null;
  const M = g.map;
  return { ...g, msgs: g.msgs.slice(-8), map: { ...M, tiles: M.tiles.join(''), room: M.room.map(v => String.fromCharCode(v + 66)).join(''), explored: M.explored.join('') } };
}
function unpackRun(r) {
  if (!r) return null;
  const M = r.map;
  return { ...r, map: { ...M, tiles: [...M.tiles].map(Number), room: [...M.room].map(c => c.charCodeAt(0) - 66), explored: [...M.explored].map(Number) } };
}
function saveObj() { return { v: 2, t: Date.now(), rev: META.rev || 0, sid: SID, meta: META, run: packRun(G) }; }
const LOCAL = { ok: false };
function save(urgent) {
  if (!META) return;
  META.rev = (META.rev || 0) + 1;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(saveObj())); LOCAL.ok = true; } catch (e) { LOCAL.ok = false; }
  if (urgent) saveCloudNow(); else saveCloudSoon();
}
const revOf = s => (s && (s.rev || (s.meta && s.meta.rev))) || 0;
function readLocal() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

  META = Object.assign(freshMetaShape(), s.meta || {});
  G = s.run ? unpackRun(s.run) : null;
  UI.showMap = META.map !== false;
}

const CLOUD = { ref: null, timer: 0, on: false, busy: false, dirty: false, stale: false };
const SID = Math.random().toString(36).slice(2);
// throttled, not debounced: continuous play still reaches the cloud every ~1.5s
function saveCloudSoon() { if (!CLOUD.ref || CLOUD.timer) return; CLOUD.timer = setTimeout(saveCloudNow, 1500); }
async function saveCloudNow() {
  if (!CLOUD.ref || !META) return;
  clearTimeout(CLOUD.timer); CLOUD.timer = 0;
  if (CLOUD.busy) { CLOUD.dirty = true; return; }
  CLOUD.busy = true;
  try {
    const cur = await CLOUD.ref.get();
    const d = cur.exists ? cur.data() : null;
    if (d && d.sid && d.sid !== SID && revOf(d) > (META.rev || 0)) {
      // another screen saved newer progress: keep it, and stop this screen from writing
      CLOUD.stale = true; CLOUD.ref = null; CLOUD.on = false;
      openDlg('別の画面で もっと新しいデータが 保存されています。この画面の内容で 上書きしないよう、保存を止めました。ページを 開きなおしてください。', [['わかった', closeDlg]]);
    } else await CLOUD.ref.set(saveObj());
  }
  catch (e) { if (e && e.code === 'invalid_argument') { CLOUD.ref = null; CLOUD.on = false; } }
  CLOUD.busy = false;
  if (CLOUD.dirty) { CLOUD.dirty = false; saveCloudNow(); }
}
async function initCloud() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.collection('data/users/' + id).doc('save');
    const snap = await ref.get();
    CLOUD.ref = ref; CLOUD.on = true;
    const local = readLocal();
    if (snap.exists) {
      const d = snap.data();
      if (d && d.meta && (!local || revOf(d) > revOf(local)) && UI.mode === 'title') {
        applySave(d);
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(d)); } catch (e) { /* ignore */ }
        showTitle();
        return;
      }
    }
    if (META) saveCloudSoon();
    if (UI.mode === 'title') showTitle();
  } catch (e) { CLOUD.on = false; }
}

function mkItem(k, floor) {
  const d = IT[k], it = { id: nextId(), k, r: 0 };
  if (d.c === 'wand') it.ch = rint(3, 6);
  if (d.c === 'gold') it.amt = rint(10, 40) + (floor || 1) * rint(6, 16);
  return it;
}
function mkEquipFixed(k) { return { id: nextId(), k, r: 0, af: [], ilv: 1, plus: 0 }; }
function rollTable(tbl) {
  const tot = tbl.reduce((s, [, w]) => s + w, 0);
  let r = Math.random() * tot;
  for (const [k, w] of tbl) { if ((r -= w) < 0) return k; }
  return tbl[0][0];
}
function rollRarity(f, boost, luck) {
  const L = 1 + luck / 100;
  const w = [55, 30 + f * 0.6, (10 + f * 0.5 + boost) * L, (2 + f * 0.15 + boost * 0.3) * L, (0.7 + f * 0.06 + boost * 0.1) * L];
  return Number(rollTable(w.map((v, i) => [i, v])));
}
function genEquip(cat, f, boost = 0, luck = 0, minR = 0) {
  let r = Math.max(minR, rollRarity(f, boost, luck));
  if (cat === 'bracelet' && r === 0) r = 1;
  if (r === 4) {
    const us = Object.keys(UNIQ).filter(u => IT[UNIQ[u].b].c === cat && UNIQ[u].fl <= f + 2);
    if (us.length) {
      const u = pick(us), U = UNIQ[u];
      const it = { id: nextId(), k: U.b, r: 4, u, ilv: f, plus: chance(0.4) ? rint(1, 3) : 0, af: U.af.map(([t, v]) => ({ t, v })) };
      addAffix(it, cat, f, 1.3);
      return it;
    }
    r = 3;
  }
  const bases = Object.keys(IT).filter(k => IT[k].c === cat && IT[k].fl <= f + 1);
  const k = rollTable(bases.map(b => [b, 1 + (IT[b].fl >= f - 4 ? 3 : 0)]));
  const it = { id: nextId(), k, r, ilv: f, af: [], plus: chance(0.18 + r * 0.06) ? rint(1, 1 + (f / 5 | 0)) : 0 };
  const n = [0, 1, rint(2, 3), rint(3, 4)][r];
  for (let i = 0; i < n; i++) addAffix(it, cat, f, r === 3 ? 1.4 : 1);
  if (r === 2) it.np = pick(RARE_PRE);
  if (r === 3) it.np = pick(LEG_PRE);
  return it;
}
function addAffix(it, cat, f, mult) {
  const sl = SLOT[cat];
  const have = new Set(it.af.map(a => a.t));
  const pool = Object.keys(AF).filter(t => AF[t].s.includes(sl) && !have.has(t) && !(t.startsWith('slay_') && [...have].some(h => h.startsWith('slay_'))));
  if (!pool.length) return;
  const t = pick(pool), A = AF[t];
  it.af.push({ t, v: A.flag ? 1 : Math.max(1, Math.round(A.r(f) * mult)) });
}
function genItem(f, boost = 0, luck = 0, equipBias = false) {
  const cat = rollTable(equipBias
    ? [['weapon', 10], ['shield', 10], ['bracelet', 7], ['grass', 5], ['scroll', 4], ['wand', 3], ['gold', 3]]
    : [['food', 10], ['grass', 24], ['scroll', 14], ['wand', 8], ['weapon', 11], ['shield', 10], ['bracelet', 6], ['gold', 14]]);
  if (cat === 'weapon' || cat === 'shield' || cat === 'bracelet') return genEquip(cat, f, boost, luck);
  if (cat === 'food') return mkItem(rollTable([['bread', 5], ['bigbread', 1]]), f);
  if (cat === 'grass') return mkItem(rollTable([['herb', 10], ['hiherb', f >= 4 ? 4 : 1], ['antidote', 3], ['strseed', 3], ['lifeberry', 2], ['sleepherb', 3], ['confherb', 3], ['happyherb', 1]]), f);
  if (cat === 'scroll') return mkItem(rollTable([['s_weapon', 4], ['s_shield', 4], ['s_sleep', 3], ['s_map', 3], ['s_bigroom', 2], ['s_thunder', 3], ['s_escape', 2]]), f);
  if (cat === 'wand') return mkItem(pick(['w_thunder', 'w_sleep', 'w_blow', 'w_swap', 'w_slow']), f);
  return mkItem('gold', f);
}
const isEquip = it => ['weapon', 'shield', 'bracelet'].includes(IT[it.k].c);
function itemName(it) {
  const d = IT[it.k];
  if (d.c === 'gold') return `${it.amt}ゴールド`;
  let s = it.u ? UNIQ[it.u].n : d.n;
  if (!it.u && it.r === 1 && it.af && it.af[0]) s = AF[it.af[0].t].pre + s;
  if (!it.u && it.np) s = it.np + s;
  if (it.plus) s += `+${it.plus}`;
  if (d.c === 'wand') s += `[${it.ch}]`;
  return s;
}
const powOf = it => it ? IT[it.k].pow + (it.plus || 0) + (it.u ? UNIQ[it.u].pw || 0 : 0) : 0;
function affixSummary(it) {
  if (!isEquip(it)) return IT[it.k].d || '';
  const base = IT[it.k].c === 'weapon' ? `攻撃力${powOf(it)}` : IT[it.k].c === 'shield' ? `防御力${powOf(it)}` : '';
  return [base, ...(it.af || []).map(a => AF[a.t].l(a.v))].filter(Boolean).join(' / ');
}
function sellPrice(it) {
  const d = IT[it.k];
  if (isEquip(it)) return Math.round((10 + (it.ilv || 1) * 6) * [1, 3, 8, 25, 50][it.r || 0] + (it.plus || 0) * 25);
  return Math.max(5, Math.round((d.price || 20) / 2.5));
}

// ================= map generation =================
function genMap() {
  const tiles = new Array(MW * MH).fill(0), room = new Array(MW * MH).fill(-1);
  const CX = 3, CY = 3, sw = 18, sh = 10;
  let rooms;
  for (;;) {
    rooms = []; let real = 0;
    for (let j = 0; j < CY; j++) for (let i = 0; i < CX; i++) {
      const x0 = 1 + i * sw, y0 = 1 + j * sh;
      if (chance(0.78)) {
        const rw = rint(4, sw - 5), rh = rint(3, sh - 4);
        rooms.push({ x: rint(x0 + 1, x0 + sw - 2 - rw), y: rint(y0 + 1, y0 + sh - 2 - rh), w: rw, h: rh, i, j });
        real++;
      } else rooms.push({ x: rint(x0 + 3, x0 + sw - 4), y: rint(y0 + 2, y0 + sh - 3), w: 1, h: 1, i, j, dummy: true });
    }
    if (real >= 5) break;
  }
  rooms.forEach((r, ri) => {
    for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) {
      tiles[idx(x, y)] = r.dummy ? 2 : 1;
      if (!r.dummy) room[idx(x, y)] = ri;
    }
  });
  const carve = (x, y) => { if (tiles[idx(x, y)] === 0) tiles[idx(x, y)] = 2; };
  const connect = (a, b) => {
    if (a.i !== b.i) {
      if (a.i > b.i) [a, b] = [b, a];
      const ya = a.dummy ? a.y : rint(a.y, a.y + a.h - 1), yb = b.dummy ? b.y : rint(b.y, b.y + b.h - 1);
      const xa = a.dummy ? a.x : a.x + a.w, xb = b.dummy ? b.x : b.x - 1;
      const mx = rint(xa + 1, xb - 1);
      for (let x = xa; x <= mx; x++) carve(x, ya);
      for (let y = Math.min(ya, yb); y <= Math.max(ya, yb); y++) carve(mx, y);
      for (let x = mx; x <= xb; x++) carve(x, yb);
    } else {
      if (a.j > b.j) [a, b] = [b, a];
      const xa = a.dummy ? a.x : rint(a.x, a.x + a.w - 1), xb = b.dummy ? b.x : rint(b.x, b.x + b.w - 1);
      const ya = a.dummy ? a.y : a.y + a.h, yb = b.dummy ? b.y : b.y - 1;
      const my = rint(ya + 1, yb - 1);
      for (let y = ya; y <= my; y++) carve(xa, y);
      for (let x = Math.min(xa, xb); x <= Math.max(xa, xb); x++) carve(x, my);
      for (let y = my; y <= yb; y++) carve(xb, y);
    }
  };
  const key = (i, j) => j * CX + i, seen = new Set(), edges = new Set();
  const start = [rint(0, CX - 1), rint(0, CY - 1)], stack = [start];
  seen.add(key(...start));
  const nbrs = (i, j) => [[1,0],[-1,0],[0,1],[0,-1]].map(([a, b]) => [i + a, j + b]).filter(([a, b]) => a >= 0 && b >= 0 && a < CX && b < CY);
  while (stack.length) {
    const [i, j] = stack[stack.length - 1];
    const nb = nbrs(i, j).filter(n => !seen.has(key(...n)));
    if (!nb.length) { stack.pop(); continue; }
    const n = pick(nb); seen.add(key(...n));
    edges.add([key(i, j), key(...n)].sort().join(','));
    stack.push(n);
  }
  for (let e = rint(1, 3); e > 0; e--) {
    const i = rint(0, CX - 1), j = rint(0, CY - 1), n = pick(nbrs(i, j));
    edges.add([key(i, j), key(...n)].sort().join(','));
  }
  for (const e of edges) { const [a, b] = e.split(',').map(Number); connect(rooms[a], rooms[b]); }
  return { tiles, room, rooms, explored: new Array(MW * MH).fill(0), stairs: null, circle: null };
}

const walk = (x, y) => inb(x, y) && G.map.tiles[idx(x, y)] > 0;
const monAt = (x, y) => G.monsters.find(m => m.x === x && m.y === y);
const itemAt = (x, y) => G.items.find(i => i.x === x && i.y === y);
const occupied = (x, y) => (G.player.x === x && G.player.y === y) || !!monAt(x, y);
const cornerOK = (x, y, dx, dy) => !(dx && dy) || (walk(x + dx, y) && walk(x, y + dy));
const canStep = (x, y, dx, dy) => walk(x + dx, y + dy) && cornerOK(x, y, dx, dy);
const realRooms = () => G.map.rooms.map((r, i) => [r, i]).filter(([r]) => !r.dummy);
const isSpecial = (x, y) => { const M = G.map; return (M.stairs && M.stairs.x === x && M.stairs.y === y) || (M.circle && M.circle.x === x && M.circle.y === y); };

function randomFloor(avoidRoom = -1) {
  for (let t = 0; t < 500; t++) {
    const cand = realRooms().filter(([, i]) => i !== avoidRoom);
    const [r] = pick(cand.length ? cand : realRooms());
    const x = rint(r.x, r.x + r.w - 1), y = rint(r.y, r.y + r.h - 1);
    if (isSpecial(x, y) || itemAt(x, y) || monAt(x, y) || (G.player.x === x && G.player.y === y)) continue;
    return { x, y };
  }
  return null;
}

function nextFloor() {
  G.floor++;
  G.map = genMap(); G.monsters = []; G.items = []; G.mapRead = false;
  const p = G.player;
  p.x = -1; p.y = -1;
  const st = randomFloor();
  const pp = randomFloor(G.map.room[idx(st.x, st.y)]);
  p.x = pp.x; p.y = pp.y; p.rx = p.x; p.ry = p.y;
  if (G.floor < LAST) G.map.stairs = st;
  else G.items.push({ ...mkItem('gem'), ...st });
  if (G.floor % 5 === 0 && G.floor < LAST) { const c = randomFloor(); if (c) G.map.circle = c; }
  if (G.floor > META.deepest) META.deepest = G.floor;
  const luck = calcStats().luck;
  const nItems = rint(6, 9);
  for (let i = 0; i < nItems; i++) { const pos = randomFloor(); if (pos) G.items.push({ ...genItem(G.floor, 0, luck), ...pos }); }
  const nChest = rint(1, 2) + (G.floor % 5 === 0 ? 1 : 0);
  for (let i = 0; i < nChest; i++) {
    const pos = randomFloor(); if (!pos) continue;
    if (G.floor >= 2 && chance(0.12)) spawnMimic(pos.x, pos.y);
    else G.items.push({ id: nextId(), k: chance(0.15 + G.floor * 0.01) ? 'gchest' : 'chest', r: 0, ...pos });
  }
  for (const b of META.bags) {
    if (b.floor !== G.floor) continue;
    const pos = randomFloor(); if (pos) G.items.push({ id: nextId(), k: 'bag', r: 0, bag: b.id, ...pos });
  }
  const nMon = rint(4, 6) + Math.floor(G.floor / 3);
  for (let i = 0; i < nMon; i++) {
    const pos = randomFloor(G.map.room[idx(p.x, p.y)]);
    if (pos) spawnMonster(pos.x, pos.y, chance(0.3));
  }
  buildMapCanvas();
  computeVis();
  floorTransition();
  if (G.items.some(i => i.k === 'bag')) msg('このフロアに 遺品の袋の気配がする…（地図にむらさきで表示）');
  if (G.map.circle) msg('このフロアには 帰還の魔法陣がある。');
  save(true);
}
function spawnMonster(x, y, asleep, forceKey) {
  const f = G.floor;
  let k = forceKey;
  if (!k) {
    if (f >= 3 && chance(0.035)) k = 'kin';

      if (it.k === 'bigbread' && p.hunger >= p.mhunger) { p.mhunger += 10; p.hunger = p.mhunger; msg(`${d.n}を食べた。最大満腹度が 10 上がった。`); }
      else { p.hunger = Math.min(p.mhunger, p.hunger + d.food); msg(`${d.n}を食べた。おなかが ふくれた。`); }
      break;
    case 'herb': removeInv(it); msg('薬草を飲んだ。'); healPlayer(30, 1); sfx('eat'); break;
    case 'hiherb': removeInv(it); msg('上薬草を飲んだ。'); healPlayer(100, 2); sfx('eat'); break;
    case 'antidote': removeInv(it); p.str = Math.max(p.str, p.mstr); msg('毒消し草を飲んだ。力が 元にもどった。'); sfx('eat'); break;
    case 'sleepherb': removeInv(it); if (st.rsleep) msg('眠り草を飲んだが 眠くならなかった。'); else { p.sleep = 5; msg('眠り草を飲んだ。アテナは 眠ってしまった…'); } break;
    case 'confherb': removeInv(it); p.conf = 10; msg('混乱草を飲んだ。目がまわる…'); break;
    case 'happyherb': removeInv(it); msg('しあわせ草を飲んだ。'); p.exp = EXP[p.lv + 1]; levelUp(); break;
    case 'strseed': removeInv(it); p.mstr++; p.str++; msg('力の種を食べた。力が 1 上がった！'); sfx('lvup'); break;
    case 'lifeberry': removeInv(it); p.mhp += 5; p.hp += 5; msg('命の実を食べた。最大HPが 5 上がった！'); sfx('lvup'); break;
    case 's_weapon': case 's_shield': {
      removeInv(it); const eq = eqItem(it.k === 's_weapon' ? 'w' : 's');
      msg(`${d.n}を読んだ。`);
      if (eq) { eq.plus = (eq.plus || 0) + 1; msg(`${itemName(eq)} に 強化された！`); sfx('magic'); }
      else msg('しかし 何も起こらなかった。');
      break;
    }
    case 's_sleep': removeInv(it); msg('眠りの巻物を読んだ。');
      G.monsters.filter(m => VIS[idx(m.x, m.y)] && !m.disg).forEach(m => { m.sleep = 12; floatText(m.x, m.y, 'Z', '#c8a8ff'); });
      sfx('magic'); break;
    case 's_map': removeInv(it); msg('あかりの巻物を読んだ。フロアのようすが わかった！');
      for (let i = 0; i < MW * MH; i++) if (G.map.tiles[i] > 0) G.map.explored[i] = 1;
      G.mapRead = true; sfx('magic'); break;
    case 's_bigroom': {
      removeInv(it); msg('大部屋の巻物を読んだ。フロアが ひとつの大部屋になった！');
      const M = G.map;
      M.rooms = [{ x: 1, y: 1, w: MW - 2, h: MH - 2 }];
      for (let y = 1; y < MH - 1; y++) for (let x = 1; x < MW - 1; x++) { M.tiles[idx(x, y)] = 1; M.room[idx(x, y)] = 0; }
      buildMapCanvas(); sfx('magic'); FX.shake = now(); break;
    }
    case 's_thunder': removeInv(it); msg('いかずちの巻物を読んだ。');
      G.monsters.filter(m => VIS[idx(m.x, m.y)]).forEach(m => {
        FX.bolts.push({ x0: m.x, y0: m.y - 3, x1: m.x, y1: m.y, col: '#fff27a', t0: now(), dur: 200 });
        revealMimic(m);
        hurtMonster(m, MON[m.k].treasure ? 1 : 20 + G.floor * 2, '#fff27a');
      });
      sfx('magic'); break;
    case 's_escape': removeInv(it); msg('脱出の巻物を読んだ。アテナの体が 光につつまれた…'); sfx('magic');
      UI.mode = 'busy'; { const g = G; setTimeout(() => { if (G === g) endRun('escape'); }, 800); } return false;
    default:
      if (d.c === 'wand') return zapWand(it);
  }
  return true;
}
function zapWand(it) {
  const d = IT[it.k], p = G.player;
  bump(p, p.dir[0], p.dir[1]);
  if (it.ch <= 0) { msg(`${d.n}を振った。しかし 何も起こらなかった。`); return true; }
  it.ch--;
  const tg = lineTarget(10);
  FX.bolts.push({ x0: p.x, y0: p.y, x1: tg.x, y1: tg.y, col: d.pal.c, t0: now(), dur: 180 });
  sfx('magic');
  msg(`${d.n}を振った。`);
  const m = tg.m;
  if (!m) { msg('魔法弾は 飛んでいった。'); return true; }
  revealMimic(m);
  const mn = MON[m.k].n;
  m.aware = true;
  switch (it.k) {
    case 'w_thunder': hurtMonster(m, MON[m.k].treasure ? 1 : rint(18, 26) + G.floor * 2, '#fff27a'); break;
    case 'w_sleep': m.sleep = 15; msg(`${mn} は 眠ってしまった。`); break;
    case 'w_slow': m.slow = 40; msg(`${mn} の動きが おそくなった。`); break;
    case 'w_swap': {
      const [px, py] = [p.x, p.y]; p.x = m.x; p.y = m.y; m.x = px; m.y = py; m.rx = m.x; m.ry = m.y;
      msg(`${mn} と 位置が 入れかわった。`); afterStep(); break;
    }
    case 'w_blow': {
      const [dx, dy] = p.dir; let n = 0;
      while (n < 10 && canStep(m.x, m.y, dx, dy) && !occupied(m.x + dx, m.y + dy)) { m.x += dx; m.y += dy; n++; }
      msg(`${mn} を ふきとばした！`);
      hurtMonster(m, 5);
      break;
    }
  }
  return true;
}
function throwItem(it) {
  const p = G.player, d = IT[it.k];
  removeInv(it);
  bump(p, p.dir[0], p.dir[1]);
  const tg = lineTarget(10);
  FX.bolts.push({ x0: p.x, y0: p.y, x1: tg.x, y1: tg.y, spr: [d.s, d.pal], t0: now(), dur: 200 });
  msg(`${itemName(it)} を 投げた。`);
  const m = tg.m;
  if (m && chance(0.9)) {
    const mn = MON[m.k].n;
    revealMimic(m);
    m.aware = true; m.sleep = 0;
    if (it.k === 'herb' || it.k === 'hiherb') { m.hp = Math.min(m.maxHp, m.hp + (it.k === 'herb' ? 30 : 100)); msg(`${mn} の HPが 回復した。`); }
    else if (it.k === 'sleepherb') { m.sleep = 12; msg(`${mn} は 眠ってしまった。`); }
    else if (it.k === 'confherb') { m.conf = 12; msg(`${mn} は 混乱した。`); }
    else {
      const dmg = MON[m.k].treasure ? 1 : isEquip(it) ? powOf(it) + rint(2, 5) : rint(1, 2);
      msg(`${mn} に 当たった。`);
      if (isEquip(it)) dropItem(it, tg.x, tg.y);
      hurtMonster(m, dmg);
    }
    return true;
  }
  if (m) msg(`${MON[m.k].n} に かわされた。`);
  if (!dropItem(it, tg.x, tg.y)) msg(`${itemName(it)} は 消えてしまった。`);
  return true;
}
function putItem(it) {
  const p = G.player;
  if (itemAt(p.x, p.y) || isSpecial(p.x, p.y)) { msg('ここには 置けない。'); return false; }
  removeInv(it); it.x = p.x; it.y = p.y; G.items.push(it);
  msg(`${itemName(it)} を 足元に置いた。`);
  return true;
}
function toggleEquip(it, p) {
  const sl = SLOT[IT[it.k].c], eq = p ? p.eq : META.eq;
  if (eq[sl] === it.id) eq[sl] = 0; else eq[sl] = it.id;
  if (p) { const mh = maxHp(); if (p.hp > mh) p.hp = mh; msg(eq[sl] ? `${itemName(it)} を 装備した。` : `${itemName(it)} を はずした。`); }
  return true;
}

// ================= run lifecycle =================
function startRun(floor) {
  closeSheet();
  META.runs++;
  G = {
    floor: floor - 1, turn: 0, kills: 0, cause: '', mapRead: false, startFloor: floor,
    player: { x: 0, y: 0, rx: 0, ry: 0, dir: [0, 1], hp: 20, mhp: 20, str: 8, mstr: 8, lv: 1, exp: 0,
      hunger: 100, mhunger: 100, hacc: 0, gold: 0, inv: META.inv, eq: { ...META.eq }, sleep: 0, conf: 0, regen: 0, flash: 0 },
    monsters: [], items: [], msgs: [], map: null,
  };
  META.inv = []; META.eq = { w: 0, s: 0, b: 0 };
  G.player.hp = maxHp();
  UI.mode = 'play';
  nextFloor();
  msg(`アテナは ディクテオンの洞窟 B${floor}F に 降りたった。`);
  renderHUD(); renderMsg();
}
function endRun(kind) {
  if (!G) return;
  const p = G.player, ok = kind !== 'dead';
  const res = { kind, floor: G.floor, lv: p.lv, gold: p.gold, kills: G.kills, turn: G.turn, cause: G.cause, n: p.inv.length, lost: null, bonus: null };
  for (const it of p.inv) registerFind(it);
  if (ok) {
    META.inv = p.inv; META.eq = { ...p.eq }; META.bank += p.gold;
    if (kind === 'clear') {
      META.clears++;
      const b = genEquip(pick(['weapon', 'shield', 'bracelet']), LAST, 80, 50, 3);
      registerFind(b); META.storage.unshift(b); res.bonus = b;
    }
  } else {
    if (p.inv.length || p.gold) {
      META.bags.push({ id: nextId(), floor: G.floor, items: p.inv, gold: p.gold, t: Date.now() });
      if (META.bags.length > BAG_MAX) res.lost = META.bags.shift();
    }
    META.inv = []; META.eq = { w: 0, s: 0, b: 0 };
  }
  G = null; mapCv = null;
  UI.mode = 'result'; UI.running = false;
  closeDlg();
  save(true);
  showResult(res);
}

// ================= HUD =================
function renderHUD() {
  const el = $('hud');
  if (!G) { el.innerHTML = ''; return; }
  const p = G.player, mh = maxHp(), low = p.hp <= mh / 4;
  const chips = [p.sleep ? '<span class="chip">眠り</span>' : '', p.conf ? '<span class="chip">混乱</span>' : '', UI.dash ? '<span class="chip">ダッシュ</span>' : '', UI.faceMode ? '<span class="chip">向き</span>' : ''].join('');
  el.innerHTML = `<div class="l"><span class="fl">B${G.floor}F</span><span>Lv<b>${p.lv}</b></span><span class="${low ? 'low' : ''}">HP ${p.hp}/${mh}</span>`
    + `<span class="bar"><i style="width:${Math.max(0, p.hp / mh * 100)}%;${low ? 'background:var(--hp-low)' : ''}"></i></span></div>`
    + `<div class="l"><span class="${p.hunger <= 10 ? 'low' : ''}">満腹 ${p.hunger}</span><span class="bar food"><i style="width:${p.hunger / p.mhunger * 100}%"></i></span>`
    + `<span>力 ${p.str}</span><span><b>${p.gold}</b>G</span>${chips}</div>`;

// ---- save transfer: a pasteable text code (gzip when the browser supports it) ----
const b64 = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function pipeBytes(bytes, stream) { return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
async function exportCode() {
  const raw = new TextEncoder().encode(JSON.stringify(saveObj()));
  if (window.CompressionStream) { try { return 'DCT1Z:' + b64(await pipeBytes(raw, new CompressionStream('gzip'))); } catch (e) { /* fall through */ } }
  return 'DCT1:' + b64(raw);
}
async function importCode(code) {
  code = code.replace(/\s+/g, '');
  let bytes;
  if (code.startsWith('DCT1Z:')) {
    if (!window.DecompressionStream) throw new Error('この端末では 圧縮データを読めません');
    bytes = await pipeBytes(unb64(code.slice(6)), new DecompressionStream('gzip'));
  } else if (code.startsWith('DCT1:')) bytes = unb64(code.slice(5));
  else throw new Error('データの形式が ちがいます');
  const d = JSON.parse(new TextDecoder().decode(bytes));
  if (!d || !d.meta || !Array.isArray(d.meta.storage) || !Array.isArray(d.meta.inv)) throw new Error('データが こわれています');
  return d;
}

};

function drawTownArt(c, t = 0) {
